                  - list [ref=e486]:
                    - listitem [ref=e487]:
                      - strong [ref=e488]: Un solo actor.
                      - text: El visitante/prospecto. No hay persona "administrador" ni "soporte" porque el sitio no tiene backend ni panel real — es puramente informativo/comercial.
                    - listitem [ref=e489]:
                      - strong [ref=e490]: Un solo sistema, sin sistemas externos.
                      - text: "No aparece ninguna API, base de datos ni servicio de terceros porque:"
                      - list [ref=e491]:
                        - listitem [ref=e492]:
                          - text: El sitio es 100% estático (ver
                          - link "ADR 0001" [ref=e493] [cursor=pointer]:
                            - /url: /BIOS-AI-2026-A1/entregable-2-santiago-pavan/blob/master/docs/adr/0001-stack-vanilla-sin-build-tools.md
                          - text: ).
                        - listitem [ref=e494]:
                          - text: Los CTAs "Comenzar gratis" hoy son placeholders (
                          - code [ref=e495]: href="#"
                          - text: ) — todavía no están conectados a un formulario, CRM o pasarela de registro real.
                        - listitem [ref=e496]: El dashboard mockeado (próximo prototipo) es contenido estático servido por el mismo sitio, no una integración con el producto real de DentApp — el producto real queda fuera del alcance de este repositorio.
                    - listitem [ref=e497]:
                      - strong [ref=e498]: El MCP server queda fuera a propósito.
                      - code [ref=e499]: mcp-server/
                      - text: es una herramienta de tiempo de desarrollo que usa Claude Code para generar secciones (ver
                      - link "ADR 0003" [ref=e500] [cursor=pointer]:
                        - /url: /BIOS-AI-2026-A1/entregable-2-santiago-pavan/blob/master/docs/adr/0003-mcp-server-para-tokens-y-scaffolding.md
                      - text: ). El visitante nunca interactúa con él en runtime, así que no pertenece a un diagrama de contexto — ese tipo de tooling se documenta aparte, no como parte del sistema que ve el usuario final.
